# ===================================================================
# Service A (Order Service) Configuration
# ===================================================================

# Application name used in distributed tracing and log identification
spring.application.name=service-a

# Server Port
server.port=8081

# ===================================================================
# MySQL Database Configuration (service_a_db)
# ===================================================================
# Database parameters: localhost, 3306, user: root, password: (blank)
spring.datasource.url=jdbc:mysql://localhost:3306/service_a_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Service B (Payment Service) URL for Spring Cloud OpenFeign
# ===================================================================
service-b.url=http://localhost:8082

# ===================================================================
# Distributed Tracing Configuration (Micrometer Tracing & Brave)
# ===================================================================
# 100% sampling probability for full tracing observability
management.tracing.sampling.probability=1.0

# Logging pattern including application name, Trace ID, and Span ID
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.com.microservices.servicea=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG

# ===================================================================
# Caching Configuration
# ===================================================================
spring.cache.type=simple
