# ===================================================================
# Service B (Payment Service) Configuration
# ===================================================================

# Application name used in distributed tracing and log identification
spring.application.name=service-b

# Server Port
server.port=8082

# ===================================================================
# MySQL Database Configuration (service_b_db)
# ===================================================================
# Database parameters: localhost, 3306, user: root, password: (blank)
spring.datasource.url=jdbc:mysql://localhost:3306/service_b_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Distributed Tracing Configuration (Micrometer Tracing & Brave)
# ===================================================================
# Propagates the Trace ID received from Service A
management.tracing.sampling.probability=1.0

# Logging pattern including application name, Trace ID, and Span ID
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.com.microservices.serviceb=DEBUG
logging.level.org.springframework.web=INFO

# ===================================================================
# Caching Configuration
# ===================================================================
spring.cache.type=simple
